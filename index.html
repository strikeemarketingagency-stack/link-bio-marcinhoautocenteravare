  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #111 url("data:image/webp;base64,UklGRlgCAABXRUJQVlA4IEwCAAAwGACdASpEAHkAPpVAlkmlpCIhPZbqqLASiWcAzvCITyNp8StHrv8kQGOi+U0p+xdOjYKHjS21Ff9ooc1eRhuSLOi/4snYQwEEJKwZsaB/LWy95XjxnFkhzznSh7IODS6YVUq0ilcYtgYchkzIClSqZEa/XmvLdbwzy1Urv2XuIkW++cVLTVm4gIMpwfcMkPQASBOV5iIK80d4LxtKHsfYMpSzHnjkYSu6weckWTkNXWDY8CfkNt+hpwKvWWmF8wMERcQBsGxhtUAAAP7r9Y3vKUYe9WzfzkMM1Qm5FFDl9VG8HJQmNnGtYQC76ei36C2Agvdmg2+r85UpVyVv1OpyisqNfiF3KBNUWJB/Uu0C6539Vuh/rb91BCX+5jc+/TGrKnxqN7HNhAgxIQrTkubyNuA2z25ekJTm7A4MJa9EpF2SCxcZBbD6s2jIGMr6Hu80kIxkzVyOnEsZzDczlJukxcdvnxBLx5s/jA+TmnQg2PjIWo2fehdO9iyJTIA3sU+SINlHqRzNrKlS2W7szz0DizMGO5JkQfcjH5T7qvxIfbiZoFWNlc0fbDX7vRToCpnLglju2ayvFUG5i10+A3KJz/dAcp/mvgCeSBIC3MmoORgM5mXYjPhvENvt6vRlgSSRb446vyD+ntrt7jsZ6FI1ehcQE73XCxeH/DfSQj5SYdZuJ3gzpEZFiBUGXXFTsxi3IjOCc4/qunqrEgFjQB4no0qTML7NjapG5HVjx7vME+3OPuvuqoClCydZ+GTWAiJQJbwlGIgP9yeAAAA=") center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, .55);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 0;
    }

    /* Arte original em 340x605: todas as medidas abaixo vêm do design */
    .pagina {
      position: relative;
      z-index: 1;
      width: min(100vw, calc(100dvh * 340 / 605), 480px);
      aspect-ratio: 340 / 605;
      container-type: inline-size;
      box-shadow: 0 0 60px rgba(0, 0, 0, .6);
    }

    .pagina > img {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }

    .botao {
      position: absolute;
      left: calc(89 / 340 * 100%);
      width: calc(167 / 340 * 100%);
      border-radius: calc(5 / 340 * 100cqw);
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      outline-offset: 3px;
    }

    .botao img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .botao:hover,
    .botao:focus-visible {
      transform: scale(1.04);
      box-shadow: 0 6px 22px rgba(0, 0, 0, .55), 0 0 0 1px rgba(200, 20, 30, .7);
      filter: brightness(1.08);
    }

    .botao:active { transform: scale(1.01); filter: brightness(.95); }

    .botao:focus-visible { outline: 2px solid #d61f2c; }

    .botao   { height: calc(68.5 / 605 * 100%); }
    .agendar { top: calc(290.75 / 605 * 100%); }
    .chegar  { top: calc(366.5 / 605 * 100%); }
    .avaliar { top: calc(442.5 / 605 * 100%); }
    .site    { top: calc(518.5 / 605 * 100%); }

    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* No celular o design fica colado no topo, como no layout original */
    @media (max-width: 480px) {
      body { align-items: flex-start; }
      .pagina { box-shadow: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .botao { transition: none; }
      .botao:hover, .botao:focus-visible { transform: none; }
    }
  </style>
</head>
