  <meta property="og:title" content="Marcinho Auto Center">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #111 url("data:image/webp;base64,UklGRl4CAABXRUJQVlA4IFICAAAwGACdASpEAHkAPpVAlkmlpCIkPZfKqLASiWcA0NCIDxvp2DCQUGUmsWITyGrlTAhktW79YekPpfEglAgva9NO4F9vi5FKWLWQSVgzZOng3flDC/1s4nQDPHJfhn9TZxoOIp+m0oPrqKku/FdV2W5xTv9bX73oKBuC7gTelTa5p9g5SXBxVqHLXtNFWgeHX3BVNwT5LkEDADPV5jOkXPTpoPuY2HdBB4DsWHPRR4Htzt8PZLBnbbjFUosOEaIlnFNhofWuZmshseqAAP7r9Y2i2Lp2MezWKyKsMO5aM4mdBqoFir4Sad0JYkq52nf+Tjv/1amKqxGkjA7707hvqbOFBBFy2lmgQAmZmPSloVjO3cB2CzuDn/VM75jxnY7kWs1Lh6e4+eAFwqEHXpCg1Rc14kSFrur7JuiZ50vuVjEUN+Qg0SyWuqplij/phLAND3ddfEYw0vlyA+7yb0IorFnxT6gEUC86qDOOd0NjZyS2D3BlyJ2fztPMsRFqIyIyBHzgW9IqV1exV1KcW6T9Fyjl12jRhq09GUf/VmKju9smtvuxdqDIXSeNUMIZ8x4xs/f13hnSLZPgknsO4EN18rZCrFfRk09iV1rF9pXb/RpKJ4R3Z09Ss5hyiS5E5NvM+JFTNCLx+cSRtZmmXHdyajZOpDxDzoGyNNWLvZQTNHA6gm9ISUXXLZZ/xnbeJYPxswew602xBDO/OCp2Aotc783FyiO1KdzfU9mIjuxskEMZHgh3+Yhu+G8GUIVDhrArxGo5kOFdaAJDvvi0Lb1g4aAAAAA=") center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, .55);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 0;
    }

    /* Arte original em 340x605: todas as medidas abaixo vêm do design */
    .pagina {
      position: relative;
      z-index: 1;
      width: min(100vw, calc(100dvh * 340 / 605), 480px);
      aspect-ratio: 340 / 605;
      container-type: inline-size;
      box-shadow: 0 0 60px rgba(0, 0, 0, .6);
    }

    .pagina > img {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }

    .botao {
      position: absolute;
      left: calc(77.75 / 340 * 100%);
      width: calc(189.5 / 340 * 100%);
      border-radius: calc(5 / 340 * 100cqw);
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      outline-offset: 3px;
    }

    .botao img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .botao:hover,
    .botao:focus-visible {
      transform: scale(1.04);
      box-shadow: 0 6px 22px rgba(0, 0, 0, .55), 0 0 0 1px rgba(200, 20, 30, .7);
      filter: brightness(1.08);
    }

    .botao:active { transform: scale(1.01); filter: brightness(.95); }

    .botao:focus-visible { outline: 2px solid #d61f2c; }

    .agendar { top: calc(296.75 / 605 * 100%); height: calc(78 / 605 * 100%); }
    .chegar  { top: calc(383 / 605 * 100%);    height: calc(77.75 / 605 * 100%); }
    .avaliar { top: calc(469 / 605 * 100%);    height: calc(78 / 605 * 100%); }

    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* No celular o design fica colado no topo, como no layout original */
    @media (max-width: 480px) {
      body { align-items: flex-start; }
      .pagina { box-shadow: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .botao { transition: none; }
      .botao:hover, .botao:focus-visible { transform: none; }
    }
  </style>
</head>
