  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #111 url("data:image/webp;base64,UklGRlwCAABXRUJQVlA4IFACAABwGACdASpEAHkAPpVAlkmlpCIkPZdaqLASiWcAzniITyJp8S31faskuiynwoVNvXU5YTI7nMEUexpz3AmqS7K76Fw0RjKQjP81UdSlv7MdTNDNXOpLpWmEY/akCtMISuXaSUq2OAHk8Nc7+jfd2hM9cDmprKx2CqDo/M91WPUXsPIRYVagAlaFY4Xd4kNiM3HkY2hSEJ8rTQv18bKLcuPgreA3e+oISVqFCaeMvWWt+1IR5q+RpSjmEPjdnoz7kwEiLcu4uo+S+rTUxwAA/uv1jecpRhw1OLeOQwy0d1TpRYJhxvMclCYV161fnAr/Ds8tmaKWOXe6tyUY8BRL4Op78DmIaEhpNkEyrJG+PA3le7RtLRgV9f0VTCobYRhYBTf7gaxnxHFarnbOv5uvTyGlndxedP/jk7neMi0ouCWI3Dsf0sYRsSeHT0btFWhf5OSsfTfBB3M5j55O/RU0vc8ihpO/y8hyx+ElTvm8cF9lLREHOv91p1x9K55ZofidvZqAoT7BYNRH6qhy22kt3KqqSy6OUWGzeGMD9wQxthnKuwvYBZ7AO9ks56bmcTzAgUZwvdyN5C62j36zMKb2HvqbRK0SRYs9vCPRALZx0dKIr19vIGdUg7Hl2LAUeg83z+g9GKUaMVCDgww2A9cKCOrrShDkvxNc7Z16ZNLuKlnWprLSolfCkbVAosn9MWzcJC4Dkedzo+av1oSuYyDAYrokNND9c4Oz1sSvQqLEPz+jDGUXL1J15vi/kT4K9WcBx83W9A5bNb/3RRhRebaJgAAA") center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, .55);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 0;
    }

    /* Arte original em 340x605: todas as medidas abaixo vêm do design */
    .pagina {
      position: relative;
      z-index: 1;
      width: min(100vw, calc(100dvh * 340 / 605), 480px);
      aspect-ratio: 340 / 605;
      container-type: inline-size;
      box-shadow: 0 0 60px rgba(0, 0, 0, .6);
    }

    .pagina > img {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }

    .botao {
      position: absolute;
      left: calc(89 / 340 * 100%);
      width: calc(167 / 340 * 100%);
      border-radius: calc(5 / 340 * 100cqw);
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      outline-offset: 3px;
    }

    .botao img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .botao:hover,
    .botao:focus-visible {
      transform: scale(1.04);
      box-shadow: 0 6px 22px rgba(0, 0, 0, .55), 0 0 0 1px rgba(200, 20, 30, .7);
      filter: brightness(1.08);
    }

    .botao:active { transform: scale(1.01); filter: brightness(.95); }

    .botao:focus-visible { outline: 2px solid #d61f2c; }

    .botao   { height: calc(68.5 / 605 * 100%); }
    .agendar { top: calc(290.75 / 605 * 100%); }
    .chegar  { top: calc(366.5 / 605 * 100%); }
    .avaliar { top: calc(442.5 / 605 * 100%); }
    .site    { top: calc(518.5 / 605 * 100%); }

    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* No celular o design fica colado no topo, como no layout original */
    @media (max-width: 480px) {
      body { align-items: flex-start; }
      .pagina { box-shadow: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .botao { transition: none; }
      .botao:hover, .botao:focus-visible { transform: none; }
    }
  </style>
